name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  private-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_private_data.py

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: for f in install.sh scripts/*.sh scripts/lib/*.sh tests/scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: sudo apt-get install -y shellcheck >/dev/null && shellcheck -S error install.sh scripts/*.sh scripts/lib/*.sh tests/scripts/*.sh
      - name: "обновление по git: check-updates, автопочинка, update.sh (без Docker)"
        run: bash tests/scripts/update_test.sh
      - name: compose config
        run: cp .env.example .env && sed -i 's/^APP_MASTER_KEY=.*/APP_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/; s/^INTERNAL_API_TOKEN=.*/INTERNAL_API_TOKEN=x/; s/^DICTATION_SECRET=.*/DICTATION_SECRET=x/; s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=x/' .env && docker compose config -q

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: "poppler и tesseract (извлечение PDF и OCR — тесты без пропусков)"
        run: sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-rus >/dev/null
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: build app image
        run: docker build -f docker/app/Dockerfile -t llmp-app:ci .
      - name: приложение в образе отвечает на healthz
        run: |
          docker run -d --name app --tmpfs /data/app:uid=33 -e APP_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= llmp-app:ci
          for i in $(seq 1 30); do docker exec app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)" && exit 0; sleep 2; done
          docker logs app; exit 1

  anonymizer:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: services/anonymizer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -c constraints.txt -r requirements-dev.txt
      - run: python -m pytest -q

  asr:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: services/asr } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # тесты используют подставные VAD и провайдер — torch и GigaAM не нужны
      - run: pip install "numpy==2.5.4" "redis>=8.1,<9" "fastapi==0.149.0" "uvicorn==0.54.0" "pydantic>=2.13,<3" "pydantic-settings>=2.15,<3" pytest pytest-asyncio fakeredis httpx
      - run: python -m pytest -q
