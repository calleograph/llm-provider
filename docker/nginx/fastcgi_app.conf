# Передача запроса в php-fpm. Имя сервиса разрешается при каждом запросе: перезапуск php с новым адресом не ломает nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
set $php_upstream php:9000;
fastcgi_pass $php_upstream;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /srv/app/public$fastcgi_script_name;
fastcgi_param DOCUMENT_ROOT /srv/app/public;
fastcgi_param HTTP_PROXY "";
