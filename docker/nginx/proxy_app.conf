# Передача запроса в приложение (Uvicorn). Имя сервиса разрешается при каждом запросе: перезапуск app с новым адресом не ломает nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
set $app_upstream http://app:8000;
proxy_pass $app_upstream;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $app_scheme;
proxy_set_header Connection "";
proxy_request_buffering on;
