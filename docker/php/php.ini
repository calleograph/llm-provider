; Настройки PHP приложения (контейнер). Лимиты загрузки согласованы с nginx client_max_body_size.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 130M
max_file_uploads = 10
max_execution_time = 600
date.timezone = UTC
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
