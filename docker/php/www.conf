; Пул PHP-FPM: слушает только внутреннюю сеть Compose; размеры пула — из окружения.
[www]
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 660s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
ping.path = /fpm-ping
