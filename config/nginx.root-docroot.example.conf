# Альтернативный пример конфигурации nginx — ТОЛЬКО если хостинг/панель
# управления жёстко требует document root в корне проекта, а не в public/
# (например, готовая панель, где путь задан один раз и не настраивается).
#
# Предпочтительный вариант — config/nginx.example.conf с root .../public,
# используйте этот файл только если корневой document root — единственная
# доступная возможность.
#
# ВАЖНО: nginx не читает .htaccess (это Apache/LiteSpeed механизм) — при
# document root в корне защита каталогов src/, var/, templates/, tests/,
# bin/, config/, .git/ обеспечивается ИСКЛЮЧИТЕЛЬНО этим location-блоком.
# Если этот блок отсутствует или изменён, все секреты (var/data/*.sqlite,
# var/data/master.key) и исходный код становятся скачиваемыми напрямую.

server {
    listen 80;
    server_name ai-chat.example.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai-chat.example.local;

    ssl_certificate     /etc/ssl/ai-chat/fullchain.pem;
    ssl_certificate_key /etc/ssl/ai-chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ai-chat;
    index index.php;

    # Обязательный запрет доступа ко всем каталогам, кроме index.php,
    # api.php, admin/index.php, healthz.php и assets/ в самом корне.
    location ~ ^/(src|var|templates|tests|bin|config|vendor)(/|$) {
        deny all;
        return 403;
    }

    location ~ /\.(git|htaccess|env) {
        deny all;
        return 403;
    }

    # Явный запрет отдачи файлов данных/секретов по расширению — вторая
    # линия защиты на случай ошибки в правиле выше.
    location ~ \.(sqlite3?|db|key|pem|crt|cer|der|log|lock)$ {
        deny all;
        return 403;
    }

    location = /healthz.php {
        allow 127.0.0.1;
        # allow 10.0.0.0/24;  # адрес(а) доверенного reverse proxy/monitoring
        deny all;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index healthz.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location = / {
        try_files /index.php =404;
    }

    # Загрузка файлов в чате (лимит согласуйте с «Обезличивание» → «Макс.
    # размер файла» и upload_max_filesize/post_max_size PHP) и увеличенный
    # таймаут для api.php — ответ внешней нейросети может занимать минуты.
    location = /api.php {
        client_max_body_size 25m;
        fastcgi_read_timeout 600s;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location = /admin/ {
        try_files /admin/index.php =404;
    }

    # На время первого запуска ограничьте этот URL VPN или служебной сетью.
    # После создания локального администратора setup.php сам станет недоступен.
    # location = /admin/setup.php {
    #     allow 10.0.0.0/24;
    #     deny all;
    #     fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
