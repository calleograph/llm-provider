# Пример конфигурации nginx для корпоративного AI-чата.
# HTTPS терминируется на этом же сервере (либо на внешнем reverse proxy —
# тогда см. раздел "Система" -> "Доверенные reverse proxy" в админке).

server {
    listen 80;
    server_name ai-chat.example.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai-chat.example.local;

    ssl_certificate     /etc/ssl/ai-chat/fullchain.pem;
    ssl_certificate_key /etc/ssl/ai-chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ai-chat/public;
    index index.php;

    # Health-check доступен только с loopback / доверенных адресов —
    # дополнительно ограничиваем ещё и на уровне nginx.
    location = /healthz.php {
        allow 127.0.0.1;
        # allow 10.0.0.0/24;  # адрес(а) доверенного reverse proxy/monitoring
        deny all;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index healthz.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Главная страница — доменный вход и сам чат: загрузка файлов (лимит
    # согласуйте с «Обезличивание» → «Макс. размер файла» и
    # upload_max_filesize/post_max_size PHP) и увеличенный таймаут для
    # api.php — ответ внешней нейросети может занимать минуты.
    location / {
        client_max_body_size 25m;
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /api.php {
        client_max_body_size 25m;
        fastcgi_read_timeout 600s;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;
    }

    # На время первого запуска рекомендуется разрешить админке только VPN или
    # служебную подсеть. После создания локального администратора setup.php
    # сам становится недоступен.
    # location = /admin/setup.php {
    #     allow 10.0.0.0/24;
    #     deny all;
    #     fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Запрет доступа к каталогам вне document root (на всякий случай, если
    # структура была развёрнута неправильно).
    location ~ ^/(src|templates|var|config|tests|bin)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
