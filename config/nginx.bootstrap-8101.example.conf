# Временная конфигурация первого запуска БЕЗ reverse proxy и TLS.
# Используйте только во внутренней сети, затем замените на nginx.example.conf
# с HTTPS либо настройте TLS на reverse proxy.
server {
    listen 8101;
    server_name 192.0.2.10;

    root /srv/llm-provider/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;
    }

    # Health check не открывается из сети.
    location = /healthz.php {
        allow 127.0.0.1;
        deny all;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
