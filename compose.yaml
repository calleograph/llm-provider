# LLM-провайдер — Docker Compose. Запуск только через scripts (install.sh / update.sh / scripts/ctl.sh): они передают -p, --env-file и проверяют окружение.
# Принципы:
#  * имя проекта, порт и каталог данных — только из .env (${VAR:?}): незаданная переменная = отказ, а не молчаливый захват чужого порта;
#  * наружу опубликован один порт nginx и только на адресе APP_BIND (по умолчанию 127.0.0.1) — TLS и публичное имя на системном nginx/прокси;
#  * внутренние сервисы (обезличивание, ASR, Redis) — в сети internal без выхода в интернет: обезличивание физически не может ничего отправить наружу;
#  * данные — в ${DATA_ROOT} (вне кода и образов), секреты — в .env (права 600), в образы не попадают;
#  * непривилегированные пользователи, read_only, cap_drop ALL, no-new-privileges, healthcheck у каждого сервиса, ограничения памяти.
name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME не задан}

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  init: true
  logging: *default-logging

networks:
  internal:
    internal: true          # без выхода наружу
  egress: {}                # выход к LLM API, LDAP, SMTP — только у app

services:
  nginx:
    <<: *hardening
    build: { context: ., dockerfile: docker/nginx/Dockerfile }
    image: ${COMPOSE_PROJECT_NAME}-nginx:${IMAGE_TAG:-local}
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:?APP_PORT не задан}:8080"
    networks: [internal, egress]
    depends_on:
      app: { condition: service_healthy }
    mem_limit: ${NGINX_MEM_LIMIT:-256m}

  app:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args: { APP_VERSION: "${APP_VERSION:-0.0.0}", APP_GIT_COMMIT: "${APP_GIT_COMMIT:-unknown}" }
    image: ${COMPOSE_PROJECT_NAME}-app:${IMAGE_TAG:-local}
    read_only: true
    tmpfs: ["/tmp:uid=33,gid=33,mode=0700"]
    environment:
      APP_VAR_DIR: /data/app
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY не задан}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      DICTATION_SECRET: ${DICTATION_SECRET:?}
      ANONYMIZER_URL: http://anonymizer:8091
      ASR_URL: http://asr:8090
      ASR_ENABLED: ${ASR_ENABLED:-1}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      APP_WORKERS: ${APP_WORKERS:-4}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT не задан}/app:/data/app
      # состояние помощника — только чтение; запросы — отдельный каталог inbox (помощник пишет в свой каталог, не в доступный приложению)
      - ${DATA_ROOT}/updater:/data/updater:ro
      - ${DATA_ROOT}/updater/inbox:/data/updater/inbox
    networks: [internal, egress]
    depends_on:
      anonymizer: { condition: service_started }
    mem_limit: ${APP_MEM_LIMIT:-2g}
    stop_grace_period: 30s

  # Фоновые задачи (очередь писем, ротация журналов, старые сессии): тот же образ, что app, без портов.
  scheduler:
    <<: *hardening
    image: ${COMPOSE_PROJECT_NAME}-app:${IMAGE_TAG:-local}
    command: ["python", "-m", "llmp.scheduler"]
    read_only: true
    tmpfs: ["/tmp:uid=33,gid=33,mode=0700"]
    environment:
      APP_VAR_DIR: /data/app
      APP_MASTER_KEY: ${APP_MASTER_KEY:?}
    volumes:
      - ${DATA_ROOT}/app:/data/app
    networks: [internal, egress]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,time; sys.exit(0 if time.time() - int(open('/data/app/data/scheduler.heartbeat').read() or 0) < 180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m

  anonymizer:
    <<: *hardening
    build: { context: services/anonymizer, args: { APP_VERSION: "${APP_VERSION:-0.0.0}" } }
    image: ${COMPOSE_PROJECT_NAME}-anonymizer:${IMAGE_TAG:-local}
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700"]
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      ANON_CONCURRENCY: ${ANON_CONCURRENCY:-4}
      ANON_TIMEOUT_S: ${ANON_TIMEOUT_S:-120}
      APP_VERSION: ${APP_VERSION:-0.0.0}
    networks: [internal]
    mem_limit: ${ANON_MEM_LIMIT:-1536m}
    oom_score_adj: 300   # при нехватке памяти на сервере ядро завершает сначала наши тяжёлые службы, а не чужие процессы
    stop_grace_period: 20s

  redis:
    <<: *hardening
    profiles: [voice]
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    user: "999:999"
    read_only: true
    # пароль — через stdin, а не аргументом: аргументы процессов контейнера видны на хосте в ps
    command: ["sh", "-c", "printf 'requirepass %s\\n' \"$$REDISCLI_AUTH\" | exec redis-server - --appendonly no --save '' --maxmemory 256mb --maxmemory-policy volatile-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  asr:
    <<: *hardening
    profiles: [voice]
    build:
      context: services/asr
      args:
        TORCH_INDEX_URL: ${ASR_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        GIGAAM_GIT_COMMIT: ${GIGAAM_GIT_COMMIT:?}
        APP_VERSION: ${APP_VERSION:-0.0.0}
    image: ${COMPOSE_PROJECT_NAME}-asr:${IMAGE_TAG:-local}
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700"]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      DICTATION_SECRET: ${DICTATION_SECRET:?}
      APP_ORIGINS: ${APP_PUBLIC_URL:-}
      ASR_MODEL_NAME: ${ASR_MODEL_NAME:-v3_e2e_rnnt}
      ASR_MODEL_ID: ${ASR_MODEL_ID:-gigaam-v3-e2e-rnnt-full}
      ASR_MODEL_DIR: /models/gigaam
      ASR_DEVICE: cpu
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-0}
      ASR_INTEROP_THREADS: ${ASR_INTEROP_THREADS:-0}
      ASR_MAX_CONCURRENT_INFERENCE: ${ASR_MAX_CONCURRENT_INFERENCE:-1}
      ASR_QUEUE_SIZE: ${ASR_QUEUE_SIZE:-64}
      ASR_LANGUAGE: ru
      LOG_FORMAT: json
      HOME: /tmp
      TORCH_HOME: /tmp/torch
    volumes:
      - ${DATA_ROOT}/models:/models:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 120s
    mem_limit: ${ASR_MEM_LIMIT:-4g}
    oom_score_adj: 500   # ASR — первым при нехватке памяти (перезапустится сам), соседние службы сервера не страдают
    cpu_shares: 512
    stop_grace_period: 20s
